services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: jaco-laravel
    restart: unless-stopped
    environment:
      APP_NAME: "Jaco Jambi Sistem"
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080

      LOG_CHANNEL: stderr

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: jaco_jambi
      DB_USERNAME: jaco_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-local_app_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jaco-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: jaco-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - jaco-network

  db:
    image: mysql:8.4
    container_name: jaco-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jaco_jambi
      MYSQL_USER: jaco_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jaco-network

volumes:
  mysql_data:

networks:
  jaco-network:
    driver: bridge